<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- サイトのコード（このindex.html自体）が更新された後、閲覧者のブラウザに
     古い内容がキャッシュされて残るのをできるだけ防ぐための指定です。 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!--
  BUILD_ID: このファイルを新しく書き出す（アップロードする）たびに、下の値を変えてください。
  下のスクリプトが「今表示しているページ」と「サーバー上の最新ファイル」のBUILD_IDを
  比べて、違っていた場合だけ静かに1回だけ読み込み直します（URLは変えません）。
-->
<script>window.__BNI_BUILD_ID__ = '2026-10-04-01';</script>
<script>
(function(){
  try{
    var KEY = 'bniBuildChecked';
    if(sessionStorage.getItem(KEY) === window.__BNI_BUILD_ID__) return;
    fetch(location.pathname + location.search, { cache: 'no-store' })
      .then(function(res){ return res.ok ? res.text() : null; })
      .then(function(html){
        if(!html) return;
        sessionStorage.setItem(KEY, window.__BNI_BUILD_ID__);
        var m = html.match(/__BNI_BUILD_ID__\s*=\s*'([^']+)'/);
        if(m && m[1] && m[1] !== window.__BNI_BUILD_ID__){
          location.reload();
        }
      })
      .catch(function(){ /* 取得できなくても、通常表示を継続します */ });
  }catch(e){}
})();
</script>
<title>Bayチャプター メンバー一覧</title>
<meta name="description" content="BNIベイチャプターのメンバー一覧です。業種カテゴリーごとに会員の名刺風プロフィールを確認できます。">

<meta property="og:title" content="Bayチャプター メンバー一覧">
<meta property="og:description" content="BNIベイチャプターのメンバー一覧です。業種カテゴリーごとに会員の名刺風プロフィールを確認できます。">
<meta property="og:url" content="https://bni-bay-chapter.github.io/portal-site/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8dc;
    --surface:#FFFFFF;
    --surface-alt:#EBEFF4;
    --border:#DCE1E8;
    --ink:#151B26;
    --ink-muted:#5B6472;
    --ink-soft:#8993A3;
    --accent:#8e0000;
    --accent-ink:#FFFFFF;
    --accent-soft:#F6E3E3;
    --team-lt:#2F5D9B;
    --team-membership:#B0793C;
    --team-vcc:#1E8A99;
    --team-event:#8B5FBF;
    --status-good:#2E9B5D;
    --status-good-soft:#E1F1E7;
    --status-warn:#D98C2B;
    --status-warn-soft:#FBEDDA;
    --status-critical:#D64545;
    --status-critical-soft:#FBE2E1;
    --status-neutral:#8A94A6;
    --status-neutral-soft:#EAEDF2;
    --shadow: 0 1px 2px rgba(21,27,38,0.06), 0 8px 24px -12px rgba(21,27,38,0.12);
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161D;
      --surface:#1B212B;
      --surface-alt:#212934;
      --border:#2C3542;
      --ink:#EDEFF3;
      --ink-muted:#9AA4B2;
      --ink-soft:#6C7684;
      --accent:#D9776E;
      --accent-ink:#241010;
      --accent-soft:#3A2323;
      --team-lt:#6C93D1;
      --team-membership:#D3A06B;
      --team-vcc:#4FB9C7;
      --team-event:#B79BE0;
      --status-good:#4FBF86;
      --status-good-soft:#1B3427;
      --status-warn:#E8AE5C;
      --status-warn-soft:#3A2E19;
      --status-critical:#E8726A;
      --status-critical-soft:#3A1F1E;
      --status-neutral:#9AA4B2;
      --status-neutral-soft:#242B35;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.disp{ font-family:'Shippori Mincho', serif; text-wrap:balance; letter-spacing:.01em; }
  a{color:var(--accent);}
  button{font-family:inherit;}
  ::selection{ background:var(--accent-soft); }

  /* ---------- layout shell ---------- */
  .app{ display:flex; min-height:100vh; }
  .sidebar{
    width:220px; flex:0 0 220px;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ padding:22px 20px 16px; background:var(--accent); color:var(--accent-ink); }
  .brand .eyebrow{ font-size:11px; letter-spacing:.12em; color:inherit; opacity:.85; font-weight:700; }
  .brand h1{ font-size:19px; margin:4px 0 2px; line-height:1.35; font-weight:700; color:inherit; }
  .brand .sub{ font-size:12px; color:inherit; opacity:.85; }
  nav.tabs{ display:flex; flex-direction:column; padding:10px; gap:2px; flex:1; }
  nav.tabs button{
    text-align:left; border:none; background:transparent; color:var(--ink-muted);
    padding:10px 12px; border-radius:var(--radius-s); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  nav.tabs button .n{ font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  nav.tabs button:hover{ background:var(--surface-alt); color:var(--ink); }
  nav.tabs button.active{ background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .sidebar-foot{ padding:14px 20px; border-top:1px solid var(--border); font-size:11px; color:var(--ink-soft); line-height:1.6; }

  .main{ flex:1 1 0%; min-width:0; width:100%; }
  .topbar{
    position:sticky; top:0; z-index:5;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding:16px 28px; display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    backdrop-filter: blur(6px);
  }
  .topbar h2{ font-size:22px; margin:0; }
  .topbar .meta{ font-size:12px; color:var(--ink-muted); }
  .content{ padding:24px 28px 64px; max-width:1180px; }
  .view{ display:none; animation:fade .25s ease; }
  .view.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  /* mobile nav */
  .mobile-topbar{ display:none; }
  @media (max-width:860px){
    .sidebar{ display:none; }
    .mobile-topbar{
      display:block; position:sticky; top:0; z-index:10; background:var(--surface);
      border-bottom:1px solid var(--border);
    }
    .mobile-topbar .brand{ padding:16px 16px 8px; }
    /* スマホでは横スクロールのタブ一覧ではなく、プルダウン（select）でメニューを選ぶ形にしています。 */
    .mobile-tabs-select{
      display:block; width:calc(100% - 24px); margin:0 12px 12px; padding:11px 36px 11px 14px;
      border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface); color:var(--ink);
      font-size:14.5px; font-weight:700; font-family:inherit; cursor:pointer;
      -webkit-appearance:none; appearance:none;
      background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%23888888' stroke-width='2'%3E%3Cpath d='M5 8l5 5 5-5'/%3E%3C/svg%3E");
      background-repeat:no-repeat; background-position:right 12px center; background-size:16px;
    }
    .content{ padding:18px 16px 48px; }
    .topbar{ padding:14px 16px; }
  }

  /* ---------- generic components ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); }
  .section-title{ font-size:15px; font-weight:700; margin:0 0 2px; }
  .section-sub{ font-size:12.5px; color:var(--ink-muted); margin:0 0 14px; }
  .grid{ display:grid; gap:14px; }
  .grid.cols-4{ grid-template-columns:repeat(4,1fr); }
  .grid.cols-3{ grid-template-columns:repeat(3,1fr); }
  .grid.cols-2{ grid-template-columns:repeat(2,1fr); }
  @media (max-width:960px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;} }

  .tag{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .tag.status-good{ background:var(--status-good-soft); color:var(--status-good); }
  .tag.status-warn{ background:var(--status-warn-soft); color:var(--status-warn); }
  .tag.status-critical{ background:var(--status-critical-soft); color:var(--status-critical); }
  .tag.status-neutral{ background:var(--status-neutral-soft); color:var(--ink-muted); }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }

  .btn{ border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:9px 15px; border-radius:var(--radius-s); font-size:13.5px; cursor:pointer; font-weight:700; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--accent); padding-left:4px; padding-right:4px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- stat tiles ---------- */
  .stat-tile{ padding:18px 18px 16px; display:flex; flex-direction:column; gap:6px; }
  .stat-tile .label{ font-size:12px; color:var(--ink-muted); font-weight:700; }
  .stat-tile .value{ font-size:28px; font-weight:800; font-family:'Shippori Mincho',serif; line-height:1.1; }
  .stat-tile .value small{ font-size:14px; font-weight:700; color:var(--ink-muted); margin-left:2px; }
  .stat-tile .delta{ font-size:12px; }
  .stat-tile .delta.up{ color:var(--status-good); }
  .stat-tile .delta.down{ color:var(--status-critical); }

  /* ---------- onboarding callout ---------- */
  .callout{ background:var(--accent-soft); border:1px solid var(--border); border-radius:var(--radius-l); padding:16px 18px; margin-bottom:20px; display:flex; gap:14px; align-items:flex-start; }
  .callout .badge{ flex:0 0 auto; width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
  .callout h3{ margin:0 0 4px; font-size:14.5px; }
  .callout p{ margin:0; font-size:13px; color:var(--ink-muted); line-height:1.7; }
  .callout ul{ margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--ink-muted); line-height:1.85; }
  .callout button.close{ margin-left:auto; border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:13px; flex:0 0 auto; }

  /* ---------- avatar / member cards ---------- */
  .avatar{ box-sizing:border-box; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; flex:0 0 auto; font-family:'Shippori Mincho',serif; }
  .member-card{ padding:16px; display:flex; gap:12px; align-items:flex-start; }
  .member-card .info{ min-width:0; }
  .member-card .name{ font-weight:700; font-size:16px; margin:0 0 2px; }
  .avatar-col{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 auto; }
  .member-no-big{ font-weight:800; font-size:18px; color:var(--ink); background:var(--surface-alt); border:1px solid var(--border); border-radius:8px; padding:2px 10px; line-height:1.3; }
  .member-card .company{ font-size:13px; color:var(--ink-muted); margin:0 0 8px; overflow-wrap:anywhere; }
  .member-card .badges{ display:flex; flex-direction:column; gap:5px; }
  .badge-row{ display:flex; align-items:center; flex-wrap:wrap; gap:5px; }
  .badge-label{ font-size:11.5px; color:var(--ink-muted); }
  .cat-chip{ font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--border); color:var(--ink-muted); background:var(--surface-alt); }
  .member-hp-link{ display:inline-block; margin-top:8px; font-size:12.5px; color:var(--accent, #2563eb); text-decoration:none; }
  .member-hp-link:hover{ text-decoration:underline; }
  .member-category-group{ margin-bottom:30px; }
  .member-category-band{ display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--accent); color:var(--accent-ink); border-radius:var(--radius-m); padding:12px 18px; margin-bottom:16px; }
  .member-category-eyebrow{ font-size:10px; font-weight:700; letter-spacing:.1em; opacity:.85; margin-bottom:5px; }
  .member-category-pill{ display:inline-block; background:var(--surface); color:var(--ink); border-radius:999px; padding:7px 18px; font-size:14.5px; font-weight:800; }
  .member-category-count{ font-size:12px; font-weight:700; opacity:.9; white-space:nowrap; }
  .print-member-table{ display:none; } /* 画面では非表示。印刷・PDF出力時だけ使う専用レイアウトです */

  /* ---------- member card v2（業種カテゴリー別の名刺風カード） ---------- */
  .member-card-v2{ display:flex; flex-direction:column; overflow:hidden; }
  .mc-catch{ padding:12px 14px 0; font-weight:700; font-size:13px; line-height:1.5; color:var(--ink); overflow-wrap:anywhere; }
  .mc-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px; background:var(--accent); color:var(--accent-ink); }
  .mc-nameblock{ min-width:0; }
  .mc-name-row{ display:flex; align-items:baseline; gap:7px; }
  .mc-no{ flex:0 0 auto; display:inline-block; background:var(--surface); color:var(--accent); font-weight:800; font-size:11.5px; border-radius:999px; padding:1px 8px; }
  .mc-name-ja{ font-weight:800; font-size:16px; color:inherit; overflow-wrap:anywhere; }
  .mc-name-en{ font-size:11.5px; color:inherit; opacity:.85; margin-top:3px; white-space:nowrap; }
  .mc-photo{ flex:0 0 auto; }
  .mc-company{ font-size:11.5px; color:var(--ink-muted); padding:8px 14px 0; overflow-wrap:anywhere; }
  .mc-bio{ font-size:12.5px; color:var(--ink-soft); line-height:1.65; padding:8px 14px 0; margin:0; overflow-wrap:anywhere; }
  .mc-meta{ display:flex; flex-direction:column; gap:6px; padding:10px 14px 14px; }
  .mc-hp{ padding:0 14px 14px; }
  .team-chip{ font-size:11px; padding:2px 8px; border-radius:999px; color:#fff; font-weight:700; }
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .toolbar input[type="text"], .toolbar select{ padding:8px 11px; border-radius:var(--radius-s); border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:13px; }
  .note{ font-size:12px; color:var(--ink-soft); margin-top:14px; line-height:1.7; }

  /* ---------- rotation table ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.plain th, table.plain td{ text-align:left; padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.plain th{ font-size:11.5px; color:var(--ink-soft); font-weight:700; letter-spacing:.03em; }
  .table-scroll{ overflow-x:auto; }
  .row-person{ display:flex; align-items:center; gap:10px; }
  .row-person .avatar{ width:34px; height:34px; font-size:12px; }

  /* ---------- docs ---------- */
  .doc-row{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--border); }
  .doc-row:last-child{ border-bottom:none; }
  .doc-icon{ width:38px; height:38px; border-radius:var(--radius-s); background:var(--surface-alt); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--ink-muted); flex:0 0 auto; }
  .doc-row .name{ font-weight:700; font-size:13.5px; margin:0 0 3px; }
  .doc-row .meta{ font-size:11.5px; color:var(--ink-muted); }
  .doc-row .spacer{ flex:1; }

  /* ---------- forms ---------- */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:600px){ .form-grid{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full{ grid-column:1/-1; }
  .field label{ font-size:12.5px; font-weight:700; color:var(--ink-muted); }
  .field input, .field select, .field textarea{
    padding:10px 12px; border-radius:var(--radius-s); border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:13.5px; font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .radio-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .radio-group label{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--ink); border:1px solid var(--border); padding:8px 12px; border-radius:var(--radius-s); cursor:pointer; }
  .radio-group input{ accent-color:var(--accent); }
  .toast{ position:fixed; bottom:22px; right:22px; background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:var(--radius-m); font-size:13px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none; z-index:50; }
  .toast.show{ opacity:1; transform:none; }

  /* メンバーカードのポップアップ */
  .member-modal-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .member-modal-overlay.open{ display:flex; }
  .member-modal-box{ position:relative; width:100%; max-width:360px; max-height:88vh; overflow-y:auto; border-radius:var(--radius-l); box-shadow:var(--shadow); }
  .member-modal-close{ position:absolute; top:8px; right:8px; z-index:1; width:30px; height:30px; border-radius:50%; border:none; background:rgba(0,0,0,.45); color:#fff; font-size:16px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  /* ---------- team / task board ---------- */
  .team-card{ padding:18px; border-top:4px solid var(--c,var(--accent)); }
  .team-card .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .team-card h3{ margin:0; font-size:16px; }
  .team-card .lead{ font-size:12px; color:var(--ink-muted); margin:2px 0 0; }
  .team-card p.desc{ font-size:13px; color:var(--ink-muted); line-height:1.75; margin:0 0 12px; }
  .progress{ height:8px; border-radius:999px; background:var(--surface-alt); overflow:hidden; margin:6px 0 4px; }
  .progress > div{ height:100%; border-radius:999px; background:var(--c,var(--accent)); }
  .progress-label{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-muted); }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .member-chip{ font-size:11.5px; padding:4px 10px; border-radius:999px; background:var(--surface-alt); color:var(--ink); }

  .kanban{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px; }
  @media (max-width:700px){ .kanban{ grid-template-columns:1fr; } }
  .kanban-col{ background:var(--surface-alt); border-radius:var(--radius-m); padding:10px; }
  .kanban-col h4{ font-size:11.5px; color:var(--ink-muted); margin:2px 6px 8px; letter-spacing:.03em; display:flex; justify-content:space-between; }
  .task-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s); padding:10px 11px; margin-bottom:8px; font-size:12.5px; }
  .task-card:last-child{ margin-bottom:0; }
  .task-card .t{ font-weight:700; margin:0 0 6px; line-height:1.5; }
  .task-card .foot{ display:flex; justify-content:space-between; align-items:center; color:var(--ink-muted); font-size:11px; }

  /* ---------- master data view ---------- */
  .master-note{ background:var(--surface-alt); border:1px dashed var(--border); border-radius:var(--radius-m); padding:16px 18px; font-size:13px; color:var(--ink-muted); line-height:1.85; margin-bottom:18px; }
  .master-note strong{ color:var(--ink); }
  table.master input, table.master select{ width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:12.5px; }
  table.master td{ padding:8px 8px; }

  .footer-note{ margin-top:36px; padding-top:16px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-soft); }

  /* ---------- 印刷／PDF出力用（メンバー一覧の「印刷する」「PDFで保存」ボタンから使用） ----------
     どちらのボタンもブラウザの印刷ダイアログを開きます。「PDFで保存」は、そこで送信先を
     「PDFに保存」に切り替えていただく想定です（ブラウザだけで動く静的サイトのため、
     ダイアログを介さずに直接PDFファイルを生成することはできません）。 */
  @media print{
    .mobile-topbar, .sidebar, .topbar, .toolbar, .footer-note, .toast{ display:none !important; }
    /* 写真（アバターの背景画像）や色付きの帯を印刷時にも表示させます。
       これが無いと、ブラウザの「背景のグラフィック」設定によっては写真や色が印刷されません。 */
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    /* ダークモード環境で見ていても、印刷・PDFでは常に読みやすい黒文字・白背景にします。 */
    :root{
      --bg:#ffffff !important; --surface:#ffffff !important; --surface-alt:#f2f2f2 !important;
      --border:#cccccc !important; --ink:#000000 !important; --ink-muted:#222222 !important; --ink-soft:#444444 !important;
    }
    body, .app, .main, .content{ background:#fff !important; color:#000 !important; }
    .content{ padding:0 !important; max-width:none !important; }
    .card{ box-shadow:none !important; border:1px solid #ccc !important; }
    .member-card-v2, .team-card{ break-inside:avoid; }
    .grid.cols-3{ grid-template-columns:repeat(2,1fr) !important; }

    /* メンバー一覧の印刷・PDF出力は、画面用のCSS Grid表示は隠し、代わりに<table>で組んだ
       印刷専用のレイアウトを使います。<table>のthead（カテゴリー見出し）は、内容が複数ページに
       またがったとき、ブラウザが各ページの先頭に自動で繰り返し表示してくれるため、
       「カテゴリーが次ページに続くときも、小さく見出しが出る」状態を実現しています。 */
    .member-category-group > .member-category-band{ display:none !important; }
    .member-category-group > .grid.cols-3{ display:none !important; }
    .print-member-table{ display:table !important; width:100% !important; border-collapse:collapse !important; table-layout:fixed !important; }
    .print-member-table thead{ display:table-header-group; }
    .print-member-table th{ padding:0 0 8px; text-align:left; font-weight:normal; border:none; }
    .print-member-table td{ width:50%; padding:0 6px 12px; vertical-align:top; border:none; }
    .print-member-table tr{ break-inside:avoid; page-break-inside:avoid; }
    .print-member-table .member-category-band{ padding:7px 12px; }
    .print-member-table .member-category-pill{ font-size:12.5px; padding:5px 14px; }
    .print-member-table .member-category-eyebrow{ font-size:9px; margin-bottom:3px; }
  }
</style>
</head>
<body>

<header class="brand" style="padding:20px 24px;">
  <div class="eyebrow">BNI BAY CHAPTER</div>
  <h1 style="font-size:21px; margin:4px 0 0;">Bayチャプター メンバー一覧</h1>
</header>

<div class="content" style="margin:0 auto;">

  <div class="section-title" style="margin-top:20px;">メンバー一覧</div>
  <div class="section-sub">BNIでは「1業種1名」の専属性の原則により、同一業種の会員は1チャプターにつき1名までとなります。
    <span id="dataSourceBadge" class="tag status-neutral" style="margin-left:6px;">サンプルデータを表示中</span>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="window.print()">🖨️ 印刷する</button>
    <button class="btn primary" onclick="exportMembersPdf_()">📄 PDFで保存</button>
  </div>
  <div id="memberGrid"></div>

  <div class="footer-note">
    このページはBNIベイチャプターの会員マスターと連携した公開用メンバー一覧です。
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   このページは、ポータルサイト（会員限定ページ）から分離した
   「メンバー一覧」単体の公開ページです。他チャプターへの共有・
   検索エンジンでの表示を想定しているため、電話番号・メール
   アドレス等はAPI側（公開用API_Code.gs）で元から除外されています。
   ========================================================= */

// マスター（API）からの読み込みが終わるまでは true になりません。
// これが false の間は「読み込み中」の表示にします（実データ取得後 or タイムアウト後に true へ）。
let membersReady = false;

let members = [
  { id:1,  name:'山田 隆',   category:'税理士',           company:'やまだ税理士事務所',           categoryGroup:'リーダーシップチーム', gender:'男性' },
  { id:2,  name:'佐藤 恵美', category:'行政書士',         company:'さとう行政書士事務所',         categoryGroup:'リーダーシップチーム', gender:'女性' },
  { id:3,  name:'高橋 直樹', category:'Web制作',          company:'タカハシデザイン合同会社',     categoryGroup:'BtoBビジネスチーム',   gender:'男性' },
  { id:4,  name:'田中 美咲', category:'生命保険',         company:'タナカ生命保険代理店',         categoryGroup:'BtoBビジネスチーム',   gender:'女性' },
  { id:5,  name:'伊藤 健太', category:'不動産',           company:'伊藤不動産株式会社',           categoryGroup:'BtoBビジネスチーム',   gender:'男性' },
  { id:6,  name:'渡辺 由美', category:'美容室経営',       company:'サロン ワタナベ',              categoryGroup:'パーソナルライフスタイルチーム', gender:'女性' },
];

const AVATAR_PALETTE = ['#5C7BA6','#7A9E7E','#B08A9E','#B79A6B','#8E7CB0','#5FA3A3'];
// 性別によるアイコン配色。「性別」データがない場合は中間色（グレー系）にフォールバックします。
const GENDER_COLORS = {
  '男性': { solid:'#f0fff0', pale:'#f0fff0', text:'#0f3d33' },
  '女性': { solid:'#ffe4e1', pale:'#ffe4e1', text:'#5c2a2a' },
  default: { solid:'#8B95A1', pale:'#D9DEE4', text:'#fff' },
};

/* ベイチャプター 会員マスター 公開用API（GAS）。
   マスターの「会員マスター」シートを唯一の情報源として、電話番号・メールアドレスを
   除いた項目だけをここから取得します。取得できない場合は、下のサンプルデータのまま表示します。
   ポータルサイト（noindex.html）と同じAPIを使っていますが、このページでは
   メンバー一覧に必要な項目（payload.members）だけを使います。 */
const MEMBER_API_URL = 'https://script.google.com/macros/s/AKfycbwCpHflhEUfSbGa69FgVxTscfaM6wBSdNSCFopIq3O5Y-PzXdZb_875j75JOuAgqw2mLw/exec';

/* =========================================================
   チーム判定（メンバー一覧で「リーダーシップチーム」を必ず先頭に
   表示するための判定にのみ使用。チーム紹介ページはポータル側のみ）
   ========================================================= */
const TEAM_ALIASES = {
  LT: ['LT', 'エルティー', 'リーダーシップチーム', 'リーダーシップ', 'LEADERSHIP TEAM', 'リーダーシップ チーム'],
};
function normalizeTeamText_(s){
  return String(s || '').replace(/[\s　]/g, '').toLowerCase();
}
function resolveTeamKey_(raw){
  const norm = normalizeTeamText_(raw);
  if(!norm || norm === 'none') return '';
  for(const key in TEAM_ALIASES){
    if(TEAM_ALIASES[key].some(a => normalizeTeamText_(a) === norm)) return key;
  }
  return String(raw).trim();
}

/* =========================================================
   HELPERS（メンバーカード表示用）
   ========================================================= */
function memberById(id){ return members.find(m => m.id === id); }
function initials(name){ return name.split(' ')[0] || name.slice(0,2); }
function genderColors(gender){ return GENDER_COLORS[gender] || GENDER_COLORS.default; }
function avatarHTML(id, size){
  const m = memberById(id);
  if(!m) return '';
  const s = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size*0.33)}px;` : '';
  const c = genderColors(m.gender);
  if(m.photoUrl){
    const posY = (m.photoPosition !== undefined && m.photoPosition !== '') ? `${m.photoPosition}%` : '0%';
    const zoomRaw = Number(m.photoZoom);
    const zoom = (!isNaN(zoomRaw) && zoomRaw > 0) ? zoomRaw / 100 : 1;
    return `<div class="avatar" style="${s}border:3px solid ${c.pale};padding:0;overflow:hidden;position:relative;">
      <div style="position:absolute;inset:0;background-image:url('${m.photoUrl}');background-size:cover;background-position:center ${posY};transform:scale(${zoom});transform-origin:center ${posY};"></div>
    </div>`;
  }
  return `<div class="avatar" style="background:${c.solid};color:${c.text};${s}">${initials(m.name)}</div>`;
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove('show'), 2600);
}

// 「PDFで保存」ボタン用。静的サイトのためブラウザの印刷ダイアログを経由しますが、
// 「印刷する」ボタンと区別できるよう、先にひとこと案内を出してから開きます。
function exportMembersPdf_(){
  toast('印刷画面が開きます。送信先（プリンタ）の一覧から「PDFに保存」を選んでください');
  setTimeout(() => window.print(), 600);
}

// 自己紹介など、改行を含む可能性がある自由記述のテキストを安全に表示するためのエスケープです。
function escapeHtmlKeepBreaks_(s){
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\r\n|\r|\n/g, '<br>');
}

// 業種カテゴリー別ページ（添付の名刺風フォーマット）に合わせたメンバーカードです。
function memberCardHTML_(m){
  return `
    <div class="card member-card-v2">
      ${m.catchphrase ? `<div class="mc-catch">${escapeHtmlKeepBreaks_(m.catchphrase)}</div>` : ''}
      <div class="mc-top">
        <div class="mc-nameblock">
          <div class="mc-name-row">
            ${m.id !== undefined && m.id !== '' ? `<span class="mc-no">No.${m.id}</span>` : ''}
            <span class="mc-name-ja">${m.name}</span>
          </div>
          ${m.kana ? `<div class="mc-name-en">${m.kana}</div>` : ''}
        </div>
        <div class="mc-photo">${avatarHTML(m.id, 64)}</div>
      </div>
      ${m.company ? `<div class="mc-company">${m.company}</div>` : ''}
      ${m.bio ? `<p class="mc-bio">${escapeHtmlKeepBreaks_(m.bio)}</p>` : ''}
      <div class="mc-meta">
        ${m.category ? `<div class="badge-row"><span class="badge-label">ビジネスカテゴリー</span><span class="cat-chip">${m.category}</span></div>` : ''}
        ${m.collabCategory ? `<div class="badge-row"><span class="badge-label">協業カテゴリー</span><span class="cat-chip">${m.collabCategory}</span></div>` : ''}
        ${m.clientProfile ? `<div class="badge-row"><span class="badge-label">クライアント</span><span class="cat-chip">${m.clientProfile}</span></div>` : ''}
      </div>
      ${m.website ? `<div class="mc-hp"><a class="member-hp-link" href="${m.website}" target="_blank" rel="noopener noreferrer">🌐 ホームページを見る</a></div>` : ''}
    </div>`;
}

/* =========================================================
   RENDER: メンバー一覧
   ========================================================= */
function renderMembers(){
  const grid = document.getElementById('memberGrid');
  grid.innerHTML = '';
  if(!membersReady){
    grid.innerHTML = `<div class="note">メンバー情報を読み込み中です…</div>`;
    return;
  }

  if(!members.length){
    grid.innerHTML = `<div class="note">メンバーが登録されていません。</div>`;
    return;
  }

  // 「カテゴリー大分類」（会員マスターで指定した大枠）ごとに大きくグループ化して表示します。
  // 未設定の方は「その他」としてまとめ、一番最後に表示します。
  const groups = {};
  const order = [];
  members.forEach(m => {
    const key = (m.categoryGroup || '').trim() || 'その他';
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(m);
  });
  // 各カテゴリーの中は、会員マスターの行の並びに関わらず「表示番号」の若い順に揃えます。
  Object.keys(groups).forEach(key => {
    groups[key].sort((a, b) => {
      const na = Number(a.id), nb = Number(b.id);
      return (isNaN(na) ? Infinity : na) - (isNaN(nb) ? Infinity : nb);
    });
  });
  // カテゴリー（大分類）どうしの並び順も、各カテゴリーの中で一番若い「表示番号」を
  // 持つ人がいる順に揃えます。ただし、リーダーシップチームだけは必ず一番先頭に表示します。
  order.sort((a, b) => {
    const aIsLT = resolveTeamKey_(a) === 'LT';
    const bIsLT = resolveTeamKey_(b) === 'LT';
    if(aIsLT && !bIsLT) return -1;
    if(bIsLT && !aIsLT) return 1;
    if(a === 'その他') return 1;
    if(b === 'その他') return -1;
    const na = Number(groups[a][0] && groups[a][0].id);
    const nb = Number(groups[b][0] && groups[b][0].id);
    return (isNaN(na) ? Infinity : na) - (isNaN(nb) ? Infinity : nb);
  });

  order.forEach(cat => {
    const roster = groups[cat];
    const bandHTML = `
      <div class="member-category-band">
        <div>
          <div class="member-category-eyebrow">CATEGORY</div>
          <div class="member-category-pill">${cat}</div>
        </div>
        <div class="member-category-count">${roster.length}名</div>
      </div>`;

    const section = document.createElement('div');
    section.className = 'member-category-group';
    section.innerHTML = bandHTML;

    // 画面表示用（CSS Gridでカードを並べます）
    const screenGrid = document.createElement('div');
    screenGrid.className = 'grid cols-3';
    screenGrid.innerHTML = roster.map(m => memberCardHTML_(m)).join('');
    section.appendChild(screenGrid);

    // 印刷・PDF出力専用（<table>のthead＝カテゴリー見出しを使います。カテゴリーの中身が
    // 複数ページにまたがっても、ブラウザが各ページの先頭に見出しを自動で繰り返してくれるため、
    // 続きのページにも小さくカテゴリー名が入り、カードが途中で切れることもなくなります）。
    const rowsHTML = [];
    for(let i = 0; i < roster.length; i += 2){
      const c1 = memberCardHTML_(roster[i]);
      const c2 = roster[i + 1] ? memberCardHTML_(roster[i + 1]) : '';
      rowsHTML.push(`<tr><td>${c1}</td><td>${c2}</td></tr>`);
    }
    const printTable = document.createElement('table');
    printTable.className = 'print-member-table';
    printTable.innerHTML = `<thead><tr><th colspan="2">${bandHTML}</th></tr></thead><tbody>${rowsHTML.join('')}</tbody>`;
    section.appendChild(printTable);

    grid.appendChild(section);
  });
}

/* =========================================================
   会員マスターAPI（GAS）からの読み込み
   ・このページでは payload.members だけを使います
   ========================================================= */
function setDataSourceBadge(state){
  const el = document.getElementById('dataSourceBadge');
  if(!el) return;
  if(state === 'live'){
    el.textContent = 'マスターと連動中';
    el.className = 'tag status-good';
  } else if(state === 'loading'){
    el.textContent = 'マスターから取得中…';
    el.className = 'tag status-warn';
  } else if(state === 'error'){
    el.textContent = 'マスターに接続できず、サンプルデータを表示中';
    el.className = 'tag status-critical';
  } else {
    el.textContent = 'サンプルデータを表示中';
    el.className = 'tag status-neutral';
  }
}

function applyMembersFromAPI(payload){
  if(!payload || !Array.isArray(payload.members) || !payload.members.length) return false;
  membersReady = true;
  members = payload.members.map(m => ({
    id: m.id,
    name: m.name,
    kana: m.kana || '',
    category: m.category || '',
    categoryGroup: m.categoryGroup || '',
    company: m.company || '',
    role: m.role || '',
    team: m.team || 'none',
    photoUrl: m.photoUrl || '',
    photoPosition: m.photoPosition || '',
    photoZoom: m.photoZoom || '',
    website: m.website || '',
    gender: m.gender || '',
    bio: m.bio || '',
    catchphrase: m.catchphrase || '',
    collabCategory: m.collabCategory || '',
    clientProfile: m.clientProfile || '',
    joinDate: m.joinDate || '',
  }));
  renderMembers();
  setDataSourceBadge('live');
  return true;
}

function loadMembersFromAPI(attempt){
  attempt = attempt || 1;
  if(!MEMBER_API_URL){
    membersReady = true;
    renderMembers();
    setDataSourceBadge('default');
    return;
  }
  setDataSourceBadge('loading');

  // Googleのサーバーが少し眠っている状態（しばらくアクセスがなかった直後など）だと、
  // 最初の応答だけ時間がかかることがあります。1回目がタイムアウトしても、
  // 2回目でまず間違いなくすぐ返ってくるので、自動でもう一度だけ試してから
  // 「接続できず」の表示にします。
  const MAX_ATTEMPTS = 2;
  let settled = false;
  const timeoutId = setTimeout(() => {
    if(settled) return;
    settled = true;
    if(attempt < MAX_ATTEMPTS){
      loadMembersFromAPI(attempt + 1);
    } else {
      membersReady = true;
      renderMembers();
      setDataSourceBadge('error');
    }
  }, 10000);

  // script.google.com の /exec はCORSが効かない環境があるため、
  // JSONP（callbackパラメータでの読み込み）を使い、fetchの成否に依存しない形にしています。
  const callbackName = '__bniMembersCallback_' + Date.now() + '_' + attempt;
  window[callbackName] = function(payload){
    if(settled) return;
    settled = true;
    clearTimeout(timeoutId);
    applyMembersFromAPI(payload);
    delete window[callbackName];
  };

  const script = document.createElement('script');
  script.src = MEMBER_API_URL + (MEMBER_API_URL.includes('?') ? '&' : '?') + 'callback=' + callbackName;
  script.onerror = function(){
    if(settled) return;
    settled = true;
    clearTimeout(timeoutId);
    if(attempt < MAX_ATTEMPTS){
      loadMembersFromAPI(attempt + 1);
    } else {
      membersReady = true;
      renderMembers();
      setDataSourceBadge('error');
    }
  };
  document.head.appendChild(script);
}

/* =========================================================
   INIT
   ========================================================= */
renderMembers();
loadMembersFromAPI();
</script>
</body>
</html>
